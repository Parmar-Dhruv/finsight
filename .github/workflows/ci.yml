name: CI

on:
  push:
    branches: ["main", "dhruv", "nilay", "jay"]
  pull_request:
    branches: ["main"]

jobs:
  unit-tests:
    name: Unit tests (pure logic)
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pytest numpy python-dotenv

      - name: Run tests
        run: pytest tests -q

  syntax-check:
    name: Byte-compile all Python sources
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Byte-compile
        run: python -m compileall -q retrieval generation eval scripts api demo
